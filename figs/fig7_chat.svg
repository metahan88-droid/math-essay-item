<svg xmlns="http://www.w3.org/2000/svg" width="680" height="526" viewBox="0 0 680 526">
<rect width="100%" height="100%" fill="#f4f6f8"/>
<rect x="0" y="0" width="680" height="46" fill="#2f4a63"/>
<text x="340.0" y="30" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">수학동아리 단체 대화방 (어젯밤)</text>
<circle cx="36" cy="76" r="15" fill="#3b6ea5"/>
<text x="36" y="81" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">민</text>
<text x="62" y="70" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="12" fill="#555">민재</text>
<rect x="62" y="76" width="594" height="66" rx="10" fill="#ffffff" stroke="#d7dde3" stroke-width="1"/>
<text x="76" y="102" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">행사 봤어? 미디엄 2판이 30,000원인데 자이언트 1판은 32,000원이야.</text>
<text x="76" y="123" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">2,000원 더 싼데 피자도 2판이잖아. 미디엄 2판으로 하자!</text>
<circle cx="36" cy="176" r="15" fill="#b0563a"/>
<text x="36" y="181" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">서</text>
<text x="62" y="170" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="12" fill="#555">서연</text>
<rect x="62" y="176" width="594" height="87" rx="10" fill="#ffffff" stroke="#d7dde3" stroke-width="1"/>
<text x="76" y="202" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">나도 계산해 봤어. ㉠ 자이언트가 36 cm이고 미디엄이 24 cm니까</text>
<line x1="76" y1="206" x2="640" y2="206" stroke="#8a1c1c" stroke-width="1.2"/>
<text x="76" y="223" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">36 ÷ 24 = 1.5야. 그러니까 자이언트 1판은 미디엄 1.5판만큼이지.</text>
<line x1="76" y1="227" x2="640" y2="227" stroke="#8a1c1c" stroke-width="1.2"/>
<text x="76" y="244" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">미디엄 2판이 1.5판보다 많으니까 민재 말이 맞네.</text>
<circle cx="36" cy="297" r="15" fill="#4a7d4a"/>
<text x="36" y="302" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">하</text>
<text x="62" y="291" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="12" fill="#555">하윤</text>
<rect x="62" y="297" width="594" height="66" rx="10" fill="#ffffff" stroke="#d7dde3" stroke-width="1"/>
<text x="76" y="323" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">그런데 라지 1판이면 26,000원이라 예산도 남잖아.</text>
<text x="76" y="344" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">그냥 라지 시키면 안 돼?</text>
<circle cx="36" cy="397" r="15" fill="#7a5aa0"/>
<text x="36" y="402" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">지</text>
<text x="62" y="391" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="12" fill="#555">지호</text>
<rect x="62" y="397" width="594" height="87" rx="10" fill="#ffffff" stroke="#d7dde3" stroke-width="1"/>
<text x="76" y="423" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">페퍼로니 개수는 내가 계산할게. ㉡ 라지는 미디엄보다 지름이</text>
<line x1="76" y1="427" x2="640" y2="427" stroke="#8a1c1c" stroke-width="1.2"/>
<text x="76" y="444" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">1.25배니까 16 × 1.25 = 20개, 자이언트는 미디엄보다 지름이</text>
<line x1="76" y1="448" x2="640" y2="448" stroke="#8a1c1c" stroke-width="1.2"/>
<text x="76" y="465" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13.5" fill="#1b1b1b">1.5배니까 16 × 1.5 = 24개야. 그렇게 올려 달라고 하면 되겠다.</text>
<line x1="76" y1="469" x2="640" y2="469" stroke="#8a1c1c" stroke-width="1.2"/>
<text x="340.0" y="508" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="12" fill="#444" text-anchor="middle">※ ㉠은 서연의 발언에서 밑줄 친 부분 전체를, ㉡은 지호의 발언에서 밑줄 친 부분 전체를 가리킨다.</text>
</svg>