<svg xmlns="http://www.w3.org/2000/svg" width="660" height="394" viewBox="0 0 660 394">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="24" width="620" height="356" rx="6" fill="#fffef7" stroke="#c9bfa4" stroke-width="2"/>
<line x1="44" y1="74" x2="616" y2="74" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="101" x2="616" y2="101" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="128" x2="616" y2="128" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="155" x2="616" y2="155" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="182" x2="616" y2="182" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="209" x2="616" y2="209" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="236" x2="616" y2="236" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="263" x2="616" y2="263" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="290" x2="616" y2="290" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="317" x2="616" y2="317" stroke="#e8e2d0" stroke-width="1"/>
<line x1="44" y1="344" x2="616" y2="344" stroke="#e8e2d0" stroke-width="1"/>
<rect x="20" y="24" width="620" height="30" fill="#f6efdc"/>
<text x="40" y="45" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="15" font-weight="bold" fill="#7a6a45" text-anchor="start">✉ 가게 사장님의 쪽지 (오늘 아침)</text>
<text x="48" y="70" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">이번에 라지와 자이언트를 새로 내놓으면서 여쭙고 싶은 것이 두 가지 있습니다.</text>
<text x="48" y="97" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">① 페퍼로니가 어느 크기에서나 미디엄과 같은 정도로 촘촘해 보이려면, 페퍼로니</text>
<text x="48" y="124" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">   1개당 윗면 넓이가 미디엄과 같아야 한다고 들었습니다.* 라지와 자이언트에는</text>
<text x="48" y="151" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">   각각 몇 개씩 올리면 될까요?</text>
<text x="48" y="178" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">② 다음 학기에는 부원이 16명이 된다고 하셨지요? 1인분은 이번 모임과 같다고 할 때,</text>
<text x="48" y="205" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">   자이언트만 주문하신다면 몇 판이 필요하고 페퍼로니는 모두 몇 개를 준비하면</text>
<text x="48" y="232" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">   될까요? 또 16명분을 한 판에 담는 「패밀리」를 새로 만들어 보려고 하는데, 굽는</text>
<text x="48" y="259" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="bold" fill="#8a1c1c" text-anchor="start">   기계의 높이 때문에 두께는 미디엄과 같은 2 cm로 만들어야 합니다. 지름을 몇 cm로</text>
<text x="48" y="286" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="bold" fill="#8a1c1c" text-anchor="start">   하면 될까요?</text>
<text x="48" y="313" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="14" font-weight="normal" fill="#111" text-anchor="start">수학동아리 학생이라고 들었습니다. 계산을 좀 도와주시겠어요?</text>
<text x="616" y="366" font-family="Malgun Gothic, AppleGothic, NanumGothic, sans-serif" font-size="13" font-weight="normal" fill="#7a6a45" text-anchor="end">— ○○피자 사장</text>
</svg>